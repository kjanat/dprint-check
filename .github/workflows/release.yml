# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: Release
run-name: ${{ case(github.event_name == 'workflow_dispatch', format('Prepare {0} from {1}', inputs.version, github.sha), format('Finalize {0}', github.event.release.tag_name)) }}
on:
  # prepares artifacts, verifies them, creates the signed release commit, and creates a draft.
  workflow_dispatch:
    inputs:
      version: { description: "Stable semantic version to release (for example, v3.0.0)", required: true, type: string }
  # reacts after a maintainer publishes that draft, then verifies everything and moves floating tags.
  release: { types: [published] }
concurrency: { group: release, queue: single }
permissions: { contents: read }
env:
  CANDIDATE_ARTIFACT: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  GH_REPO: ${{ github.repository }}
  OWNER: ${{ github.repository_owner }}
  SOURCE_SHA: ${{ github.sha }}
  VERSION: ${{ inputs.version || github.event.release.tag_name }}
defaults: { run: { shell: pwsh } }
jobs:
  build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      attestation-url: "${{ steps.attestation.outputs.attestation-url }}"
      github-api-version: "${{ steps.github-api.outputs.version }}"
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: &checkout-action actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { ref: "${{ env.SOURCE_SHA }}" }
      - uses: &setup-bun-action oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version-file: package.json }
      - name: Read GitHub API version
        id: github-api
        run: |
          $version = bun -e 'import { GITHUB_API } from "./src/lib/github.ts"; process.stdout.write(GITHUB_API.version)'
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Validate release request
        env:
          GH_API_VERSION: "${{ steps.github-api.outputs.version }}"
          GH_TOKEN: "${{ github.token }}"
        run: ./.github/scripts/Test-ReleaseRequest.ps1
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run check
      - name: Attest release bundle
        id: attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with: { subject-checksums: SHA256SUMS }
      - name: Upload release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.CANDIDATE_ARTIFACT }}
          path: |
            dist/
            SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  verify:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      attestations: read
      contents: read
    steps:
      - uses: *checkout-action
        with: { ref: "${{ env.SOURCE_SHA }}" }
      - uses: *setup-bun-action
        with: { bun-version-file: package.json }
      - name: Download release candidate
        uses: &download-artifact-action actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with: { name: "${{ env.CANDIDATE_ARTIFACT }}", path: candidate }
      - run: bun install --frozen-lockfile
      - name: Verify and independently rebuild release candidate
        env:
          GH_TOKEN: "${{ github.token }}"
        run: ./.github/scripts/Test-ReleaseCandidate.ps1

  draft:
    if: github.event_name == 'workflow_dispatch'
    needs: [build, verify]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: *checkout-action
        with: { ref: "${{ env.SOURCE_SHA }}" }
      - name: Download verified release candidate
        uses: *download-artifact-action
        with: { name: "${{ env.CANDIDATE_ARTIFACT }}", path: candidate }
      - name: Create signed release commit and draft
        env:
          ATTESTATION_URL: "${{ needs.build.outputs.attestation-url }}"
          GH_API_VERSION: "${{ needs.build.outputs.github-api-version }}"
          GH_TOKEN: "${{ github.token }}"
        run: ./.github/scripts/New-ReleaseDraft.ps1

  verify-and-tag:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      attestations: read
      contents: write
    steps:
      - uses: *checkout-action
        with:
          fetch-depth: 0
          path: release
          ref: "refs/tags/${{ env.VERSION }}"
      - name: Read source commit
        id: source
        run: |
          "sha=$(git -C release rev-parse HEAD^)" >> $env:GITHUB_OUTPUT
      - uses: *checkout-action
        with:
          path: source
          ref: "${{ steps.source.outputs.sha }}"
      - uses: *checkout-action
        with:
          path: automation
          ref: "${{ env.DEFAULT_BRANCH }}"
      - uses: *setup-bun-action
        with: { bun-version-file: automation/package.json }
      - name: Read GitHub API version
        id: github-api
        run: |
          $version = bun -e 'import { GITHUB_API } from "./automation/src/lib/github.ts"; process.stdout.write(GITHUB_API.version)'
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Verify immutable release and move floating tags
        env:
          GH_API_VERSION: "${{ steps.github-api.outputs.version }}"
          GH_TOKEN: "${{ github.token }}"
        run: ./automation/.github/scripts/Complete-Release.ps1
