# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: CI
on: [push, pull_request]
concurrency: { group: "${{ github.head_ref || github.run_id }}", queue: single, cancel-in-progress: true }
permissions: { contents: read }
env: { DPRINT_VERSION: "0.56.1", NODE_VERSION: "24" }
defaults: { run: { shell: pwsh } }
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "${{ env.NODE_VERSION }}" }
      # setup-bun already detects packageManager from package.json
      - uses: oven-sh/setup-bun@v2
      - uses: kjanat/actionlint@v1
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run check
      - name: Upload built action
        uses: actions/upload-artifact@v7
        with: { name: action-dist, path: dist, if-no-files-found: error, retention-days: 1 }

  behavior:
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy: { matrix: { os: [ubuntu-latest, macos-latest, windows-latest] } }
    steps:
      - name: Use LF line endings
        uses: $/actions/git-lf

      - uses: actions/checkout@v7
      - &download-action
        name: Download built action
        uses: actions/download-artifact@v8
        with: { name: action-dist, path: dist }

      - name: Check formatting
        id: dprint
        uses: ./
        with: { dprint-version: "${{ env.DPRINT_VERSION }}" }

      - name: Verify installation outputs
        env: { OUTPUTS: "${{ toJSON(steps.dprint.outputs) }}" }
        run: |
          $outputs = $env:OUTPUTS | ConvertFrom-Json
          if ($outputs.version -ne $env:DPRINT_VERSION)        { throw "Wrong dprint version"  }
          if (-not (Test-Path -LiteralPath $outputs.location)) { throw "Missing dprint binary" }
          dprint --version

      - name: Make poorly formatted JSON file
        env: { BAD_JSON: '{"a": 1, "b": 2}' }
        run: '[IO.File]::WriteAllText((Join-Path $PWD "poorly-formatted.json"), $env:BAD_JSON)'
      - name: Check formatting with excludes
        uses: ./
        with:
          dprint-version: ${{ env.DPRINT_VERSION }}
          config-path: dprint.json
          args: --excludes poorly-formatted.json

  install-only:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - *download-action
      - env: { BAD_JSON: '{"a": 1, "b": 2}' }
        run: '[IO.File]::WriteAllText((Join-Path $PWD "poorly-formatted.json"), $env:BAD_JSON)'
      - id: dprint
        uses: ./
        with: { install-only: true, dprint-version: "${{ env.DPRINT_VERSION }}" }
      - name: Use installed dprint
        env: { OUTPUTS: "${{ toJSON(steps.dprint.outputs) }}" }
        run: |
          $outputs = $env:OUTPUTS | ConvertFrom-Json
          dprint fmt poorly-formatted.json
          dprint check poorly-formatted.json
          if (-not (Test-Path -LiteralPath $outputs.location)) { throw "Missing dprint binary" }

  no-cache:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - *download-action
      - id: dprint
        uses: ./
        with: { cache: false, dprint-version: "${{ env.DPRINT_VERSION }}" }
      - name: Verify cache outputs
        env: { OUTPUTS: "${{ toJSON(steps.dprint.outputs) }}" }
        run: |
          $outputs = $env:OUTPUTS | ConvertFrom-Json
          if ($outputs.'cache-hit'        -ne "false") { throw "Unexpected binary cache hit" }
          if ($outputs.'plugin-cache-hit' -ne "false") { throw "Unexpected plugin cache hit" }
          if ($outputs.'plugin-cache-key' -ne "")      { throw "Unexpected plugin cache key" }

  cache-prime:
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      matrix: { os: [ubuntu-latest, macos-latest, windows-latest] }
    steps:
      - name: Use LF line endings
        uses: $/actions/git-lf
      - uses: actions/checkout@v7
      - *download-action
      - uses: ./
        with: { install-only: true, dprint-version: "${{ env.DPRINT_VERSION }}" }

  cache-hit:
    needs: [quality, cache-prime]
    runs-on: ${{ matrix.os }}
    strategy: { matrix: { os: [ubuntu-latest, macos-latest, windows-latest] } }
    steps:
      - name: Use LF line endings
        uses: $/actions/git-lf
      - uses: actions/checkout@v7
      - *download-action
      - id: dprint
        uses: ./
        with: { install-only: true, dprint-version: "${{ env.DPRINT_VERSION }}" }
      - name: Verify exact cache hits
        env: { OUTPUTS: "${{ toJSON(steps.dprint.outputs) }}" }
        run: |
          $outputs = $env:OUTPUTS | ConvertFrom-Json
          if ($outputs.'cache-hit'        -ne "true") { throw "Expected binary cache hit" }
          if ($outputs.'plugin-cache-hit' -ne "true") { throw "Expected plugin cache hit" }
