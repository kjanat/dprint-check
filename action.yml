name: "dprint-check-action"
description: "Install dprint with caching, then check source formatting"
author: "thomaseizinger"
inputs:
  dprint-version:
    description: "Specific dprint version to use (ex. 0.56.1; defaults to latest)"
    required: false
    default: ""
  cache:
    description: "Cache the dprint binary and compiled WASM plugins"
    required: false
    default: "true"
  run-check:
    description: "Run dprint check after installation (set to false for install-only use)"
    required: false
    default: "true"
  config-path:
    description: "Specific dprint config to use (ex. dprint.json)"
    required: false
    default: ""
  args:
    description: "Additional arguments to pass to dprint check"
    required: false
    default: ""
outputs:
  version:
    description: "Installed dprint version"
  location:
    description: "Path to the installed dprint binary"
  cache-hit:
    description: "Whether the dprint binary was restored from cache"
  plugin-cache-hit:
    description: "Whether the compiled WASM plugin cache was restored with an exact key"
  plugin-cache-key:
    description: "Cache key used for compiled WASM plugins"
runs:
  using: "node24"
  main: "dist/main.mjs"
  post: "dist/post.mjs"
  post-if: "always()"
branding:
  icon: "check-circle"
  color: "gray-dark"
