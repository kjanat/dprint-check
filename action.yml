# yaml-language-server: $schema=https://www.schemastore.org/github-action.json
---
name: "dprint-check-action"
description: "Install dprint, then check source formatting"
author: "kjanat"
inputs:
  dprint-version:
    description: "Specific dprint version to use (ex. 0.56.1; defaults to latest)"
    required: false
    default: "latest"
  token:
    description: "GitHub token used to query dprint release metadata"
    required: false
    default: "${{ github.token }}"
  config-path:
    description: "dprint config path(s), glob(s), or remote HTTP(S) URL(s)"
    required: false
    default: ""
  args:
    description: "Additional arguments to pass to dprint check"
    required: false
    default: ""
outputs:
  version:
    description: "Installed dprint version"
  location:
    description: "Path to the installed dprint binary"
runs:
  using: "node24"
  main: "dist/main.mjs"
branding:
  icon: "check-circle"
  color: "gray-dark"
